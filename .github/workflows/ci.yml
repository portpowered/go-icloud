name: Verify library and CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-go:
    name: Go modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check all shipping modules, formatting, and dependency checksums
        run: go run ./tools/modulecheck
      - name: Verify portable SDK
        run: go test -race ./...
      - name: Verify portable CLI
        working-directory: cmd/go-icloud
        run: go test -race ./...
      - name: Build installable CLI module
        working-directory: cmd/go-icloud
        run: go build ./...
  verify:
    runs-on: windows-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned reference (no Apple access)
        shell: pwsh
        run: ./setup-reference.ps1
      - name: Lint Go (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: false
          args: --timeout=5m
      - name: Lint CLI (all linters)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: cmd/go-icloud
          only-new-issues: false
          args: --config ../../.golangci.yml --timeout=5m
      - name: Verify CLI and separate coverage
        shell: pwsh
        working-directory: cmd/go-icloud
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race '-coverpkg=./internal/...' '-coverprofile=coverage-replay.out' ./tests/replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race '-coverpkg=./internal/...' '-coverprofile=coverage-unit.out' ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race '-coverpkg=./internal/...' '-coverprofile=coverage-combined.out' ./tests/replay ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location ../..
          go run ./tools/coverage -root cmd/go-icloud -profile coverage-replay.out -min 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/coverage -root cmd/go-icloud -profile coverage-unit.out -min 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/coverage -root cmd/go-icloud -profile coverage-combined.out -min 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Verify reference tooling
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/modulecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/endpointcoverage -summary -require-covered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m ruff check tools/reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m ruff format --check tools/reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tools/reference -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure SDK replay, unit and combined coverage separately
        shell: pwsh
        run: |
          go test -race '-coverpkg=./pkg/icloud,./internal/...' '-coverprofile=coverage-replay.out' ./tests/replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/coverage -profile coverage-replay.out -min 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race '-coverpkg=./pkg/icloud,./internal/...' '-coverprofile=coverage-unit.out' ./pkg/icloud ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/coverage -profile coverage-unit.out -min 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race '-coverpkg=./pkg/icloud,./internal/...' '-coverprofile=coverage-combined.out' ./tests/replay ./pkg/icloud ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./tools/coverage -profile coverage-combined.out -min 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save separate coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage
          path: |
            coverage-*.out
            cmd/go-icloud/coverage-*.out
          if-no-files-found: error
