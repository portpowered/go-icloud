openapi: 3.0.3
info:
  title: iCloud client models
  version: 0.1.0
  description: Caller-owned authentication context and public account, Drive, and Find My results, independent of provider response envelopes.
paths: {}
components:
  schemas:
    UnknownJSONValue:
      description: Uninterpreted provider metadata, preserved as its original JSON value; its shape is genuinely unknown.
      anyOf:
        - {type: object, nullable: true}
        - {type: array, items: {$ref: '#/components/schemas/UnknownJSONValue'}}
        - {type: string}
        - {type: number}
        - {type: boolean}
      x-go-type: json.RawMessage
    AccountDevice:
      type: object
      description: Known device metadata fields are optional; future provider fields are preserved.
      properties:
        name: {type: string}
        modelDisplayName: {type: string}
        model: {type: string}
        osVersion: {type: string}
        udid: {type: string}
        serialNumber: {type: string}
        imei: {type: string}
        latestBackup: {type: string, description: Provider backup timestamp text; no timestamp format is inferred.}
        modelLargePhotoURL1x: {type: string}
        modelLargePhotoURL2x: {type: string}
        modelSmallPhotoURL1x: {type: string}
        modelSmallPhotoURL2x: {type: string}
        paymentMethods: {type: array, items: {type: string}, description: Associated payment-method identifiers.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    AccountPaymentMethod:
      type: object
      properties:
        balanceStatus: {type: string}
        id: {type: string}
        isCarKey: {type: boolean}
        lastFourDigits: {type: string}
        suspensionReason: {type: string}
        type: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    Header:
      type: object
      required: [name, value]
      description: One HTTP response or caller-owned authentication header value; repeated headers remain separate entries.
      properties:
        name: {type: string, description: Header name.}
        value: {type: string, description: Header value; authentication values may contain secrets.}
    AuthContext:
      type: object
      required: [accountID, clientID, headers]
      description: Caller-owned account identity and web authentication headers. The reusable client never saves this state.
      properties:
        accountID: {type: string, minLength: 1, x-go-name: AccountID, description: Authenticated account identifier returned by login.}
        clientID: {type: string, minLength: 1, x-go-name: ClientID, description: Client identifier reused by this account session.}
        accountServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: AccountServiceURL, description: HTTPS account origin from authenticated discovery; required by account reads except regional plan summaries.}
        findMyServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: FindMyServiceURL, description: HTTPS Find My origin from authenticated discovery.}
        setupServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: SetupServiceURL, description: HTTPS setup origin from authentication; required for remote erase token lookup.}
        sessionToken: {type: string, description: Secret authenticated web session token; missing tokens remain distinguishable from empty tokens.}
        driveServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: DriveServiceURL, description: HTTPS Drive origin from authenticated discovery; required by Drive operations.}
        driveDocumentServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: DriveDocumentServiceURL, description: HTTPS document-service origin from authenticated discovery; required by Drive transfers.}
        driveToken: {type: string, x-go-type-skip-optional-pointer: true, description: Secret Drive query token returned by an upload; retained only by an explicit Drive session or supplied by the caller.}
        chinaMainland: {type: boolean, default: false, description: Authenticated account region; true selects the mainland China subscription gateway.}
        clientBuildNumber: {type: string, description: Optional build parameter from the authentication context; omission remains omission.}
        clientMasteringNumber: {type: string, description: Optional mastering parameter from the authentication context; omission remains omission.}
        headers: {type: array, items: {$ref: '#/components/schemas/Header'}, description: Account-specific cookie and web headers; an absent Accept value defaults to the reference wildcard.}
        cookies: {type: array, x-go-type-skip-optional-pointer: true, items: {$ref: '#/components/schemas/AuthCookie'}, description: 'Caller-owned session cookies. A fresh operation-local jar scopes them by host, path and expiry; explicit Cookie headers keep precedence.'}
    AuthCookie:
      type: object
      required: [name, value]
      description: Caller-owned web cookie state; credential values may contain secrets.
      properties:
        name: {type: string, description: Cookie name.}
        value: {type: string, description: Secret cookie value.}
        domain: {type: string, x-go-type-skip-optional-pointer: true, description: Cookie domain; omission binds to the operation's first request host.}
        hostOnly: {type: boolean, x-go-type-skip-optional-pointer: true, description: Bind exactly to the supplied domain host when true; never send to its subdomains.}
        path: {type: string, x-go-type-skip-optional-pointer: true, description: Cookie path; omission uses the first request's default cookie path.}
        secure: {type: boolean, x-go-type-skip-optional-pointer: true, description: Send this cookie only over HTTPS when true.}
        httpOnly: {type: boolean, x-go-name: HTTPOnly, x-go-type-skip-optional-pointer: true, description: Preserve the cookie's HTTP-only attribute.}
        expires: {type: string, format: date-time, description: Absolute expiry; omission represents a session cookie.}
        maxAge: {type: integer, x-go-type-skip-optional-pointer: true, description: 'Expiry in seconds: zero means unspecified and a negative value removes the cookie.'}
        sameSite: {type: string, enum: [default, lax, strict, none], x-enum-varnames: [AuthCookieSameSiteDefault, AuthCookieSameSiteLax, AuthCookieSameSiteStrict, AuthCookieSameSiteNone], description: Optional browser same-site attribute; native HTTP requests preserve this state without a browser navigation policy.}
      example: {name: synthetic-session, value: synthetic-secret, domain: '.example.invalid', path: '/', secure: true}
    ResponseMetadata:
      type: object
      required: [statusCode, headers]
      description: Response status and headers, including Set-Cookie values for caller-owned session updates.
      properties:
        cookieScopeURL: {type: string, x-go-name: CookieScopeURL, x-go-type-skip-optional-pointer: true, description: Request HTTPS origin and escaped path without query credentials; use this URL to apply Set-Cookie host and default-path scope.}
        statusCode: {type: integer, minimum: 100, maximum: 599, description: Provider HTTP response status.}
        headers: {type: array, items: {$ref: '#/components/schemas/Header'}, description: Header entries sorted by name; repeated values retain order within each name.}
    AccountMetadata:
      type: object
      description: Additional uninterpreted account-level provider fields; nulls and original JSON numbers remain intact.
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetAccountDevicesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountDevicesResult:
      type: object
      required: [devices, paymentMethods, additionalMetadata, metadata]
      description: Fresh account devices and payment-method details. Empty devices are successful; no shared cache is used.
      properties:
        devices: {type: array, items: {$ref: '#/components/schemas/AccountDevice'}}
        paymentMethods: {type: array, items: {$ref: '#/components/schemas/AccountPaymentMethod'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example:
        devices: [{name: synthetic-device, modelDisplayName: Synthetic Model}]
        paymentMethods: []
        additionalMetadata: {}
        metadata: {statusCode: 200, headers: []}
    ErrorKind:
      type: string
      description: Inspectable client failure class; errors preserve their cause separately from their safe display message.
      enum: [configuration, transport, canceled, timeout, unauthorized, forbidden, not-found, rate-limited, unavailable, provider, invalid-response, closed, not-directory, not-in-trash, no-devices]

    NullableJSONValue:
      description: An uninterpreted named provider value; distinguish omitted values from explicit JSON null.
      nullable: true
      x-go-type: json.RawMessage

    AccountFamilyMember:
      type: object
      properties:
        lastName: {type: string, nullable: true}
        dsid: {type: string, nullable: true}
        originalInvitationEmail: {type: string, nullable: true}
        fullName: {type: string, nullable: true}
        appleIdForPurchases: {type: string, nullable: true}
        appleId: {type: string, nullable: true}
        firstName: {type: string, nullable: true}
        ageClassification: {$ref: '#/components/schemas/NullableJSONValue'}
        familyId: {$ref: '#/components/schemas/NullableJSONValue'}
        hasParentalPrivileges: {$ref: '#/components/schemas/NullableJSONValue'}
        hasScreenTimeEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        hasAskToBuyEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        hasSharePurchasesEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        shareMyLocationEnabledFamilyMembers: {$ref: '#/components/schemas/NullableJSONValue'}
        hasShareMyLocationEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        dsidForPurchases: {$ref: '#/components/schemas/NullableJSONValue'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountStorageUsage:
      type: object
      required: [usedStorageInBytes, totalStorageInBytes]
      properties:
        usedStorageInBytes: {type: integer, format: int64, minimum: 0, description: Used storage in bytes.}
        totalStorageInBytes: {type: integer, format: int64, minimum: 0, description: Total storage in bytes; used storage may exceed quota.}
        compStorageInBytes: {type: integer, format: int64, minimum: 0, description: Provider comp storage in bytes.}
        commerceStorageInBytes: {type: integer, format: int64, minimum: 0, description: Provider commerce storage in bytes.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountQuota:
      type: object
      properties:
        overQuota: {type: boolean}
        haveMaxQuotaTier: {type: boolean}
        almost-full: {type: boolean}
        paidQuota: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountMediaUsage:
      type: object
      required: [mediaKey]
      properties:
        mediaKey: {type: string}
        displayLabel: {type: string}
        displayColor: {type: string, description: Provider display color text; no encoding is inferred.}
        usageInBytes: {type: integer, format: int64, minimum: 0, description: Storage used by this media category in bytes.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetAccountFamilyRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountFamilyResult:
      type: object
      required: [members, additionalMetadata, metadata]
      description: Fresh family records; an omitted family list is successful and empty.
      properties:
        members: {type: array, items: {$ref: '#/components/schemas/AccountFamilyMember'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {members: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    GetAccountMemberPhotoRequest:
      type: object
      required: [auth, memberID]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        memberID: {type: string, minLength: 1, x-go-name: MemberID, description: Member DSID returned by GetAccountFamily; no complete member object is needed.}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
        memberID: synthetic-member
    GetAccountMemberPhotoResult:
      type: object
      required: [content, metadata]
      description: Exact member-photo bytes, including an empty successful body, and their HTTP metadata.
      properties:
        content: {type: string, format: byte, description: Exact response bytes; do not infer an image format from the provider label.}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {content: '', metadata: {statusCode: 200, headers: []}}
    GetAccountStorageRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountStorageResult:
      type: object
      required: [usage, media, additionalMetadata, metadata]
      description: Fresh storage usage and available quota/media metadata. Byte counts remain absolute, including zero totals and usage above quota.
      properties:
        usage: {$ref: '#/components/schemas/AccountStorageUsage'}
        quota: {$ref: '#/components/schemas/AccountQuota'}
        media: {type: array, items: {$ref: '#/components/schemas/AccountMediaUsage'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {usage: {usedStorageInBytes: 15, totalStorageInBytes: 100}, media: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    GetAccountPlanSummaryRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: [], chinaMainland: false}
    GetAccountPlanSummaryResult:
      type: object
      required: [summary, metadata]
      description: Opaque subscription JSON; no unobserved plan fields are inferred.
      properties:
        summary: {$ref: '#/components/schemas/UnknownJSONValue'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {summary: {}, metadata: {statusCode: 200, headers: []}}

    DriveShareID:
      type: object
      description: Provider sharing descriptor; no fixed field is universally required by the reference.
      properties:
        owner: {type: string}
        zone: {type: string}
        share: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    OpenDriveSessionRequest:
      type: object
      required: [auth]
      description: Bind caller-owned authentication to an explicit Drive cache and credential lifecycle; opening performs no network request.
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
    DriveLocationRequest:
      type: object
      description: Read a cached root or trash entry, optionally replacing it with a fresh provider read.
      properties:
        refresh: {type: boolean, x-go-type-skip-optional-pointer: true, default: false}
    DriveChildrenRequest:
      type: object
      properties:
        force: {type: boolean, x-go-type-skip-optional-pointer: true, default: false, description: Fetch and merge fresh folder metadata before rebuilding children.}
    DriveLookupRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, description: Exact child display name including extension.}
    DriveEntryRequest:
      type: object
      additionalProperties: false
      description: Operate on an entry already bound to its Drive session.
    DriveDirectoryResult:
      type: object
      required: [names]
      properties:
        names: {type: array, items: {type: string}, description: Ordered child display names; empty folders return an empty array.}
    DriveChildrenResult:
      type: object
      required: [entries]
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/DriveEntrySnapshot'}, x-go-type: '[]*DriveEntry', description: Entries bound to the same session; JSON encoding emits copied snapshots.}
    DriveEntrySnapshot:
      type: object
      required: [data, name, type]
      description: Copied metadata and computed display properties. Snapshot values do not mutate a cached entry.
      properties:
        data: {$ref: '#/components/schemas/DriveNode'}
        name: {type: string, description: 'Name including extension, with provider ID/root/unknown fallback.'}
        type: {type: string, x-extensible-enum: [file, folder, trash, unknown], description: Lowercase provider type with reference fallback for absent values.}
        size: {type: integer, format: int64, minimum: 0, description: Nonzero file size; omitted for folders and zero-byte files to match the reference property.}
        dateChanged: {type: string, format: date-time, description: Reference-adjusted changed timestamp; preserves the pinned arithmetic for negative offsets with minute components.}
        dateModified: {type: string, format: date-time, description: Reference-adjusted modified timestamp.}
        dateLastOpen: {type: string, format: date-time, description: Reference-adjusted last-open timestamp.}
    DriveFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, description: New folder name under the selected entry.}
    DriveRenameRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, description: New name for the selected entry.}
    DriveUploadRequest:
      type: object
      required: [filename, content]
      description: Upload into an entry using its document identifier and zone; the caller owns the reader.
      properties:
        filename: {type: string}
        content: {type: string, format: binary, x-go-type: io.ReadSeeker}
        modificationTime: {type: string, format: date-time}
        creationTime: {type: string, format: date-time}
    DriveEntryDownloadResult:
      type: object
      required: [content, localEmpty]
      description: Downloaded bytes, or a local empty result for numeric zero-byte nodes with no fabricated HTTP status.
      properties:
        content: {type: string, format: byte, x-go-type: '[]byte'}
        localEmpty: {type: boolean, description: True when the zero-byte node shortcut performs no content request.}
        tokenMetadata: {$ref: '#/components/schemas/ResponseMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    DriveNode:
      type: object
      description: Optional provider node metadata. Folder contents may be absent on a status-only response.
      properties:
        drivewsid: {type: string}
        docwsid: {type: string}
        name: {type: string}
        extension: {type: string}
        etag: {type: string}
        zone: {type: string}
        type:
          type: string
          description: Open provider node kind; known values include FILE and FOLDER.
          x-extensible-enum: [FILE, FOLDER]
        status:
          type: string
          description: Open provider status; known values include OK and NOT_FOUND.
          x-extensible-enum: [OK, NOT_FOUND]
        size:
          anyOf:
            - {type: integer, format: int64, minimum: 0}
            - {type: string, pattern: '^[0-9]+$'}
          description: File size in bytes; reference conversion accepts integer or decimal text. Omitted for folders.
          x-go-type: json.RawMessage
        dateChanged: {type: string, format: date-time}
        dateModified: {type: string, format: date-time}
        lastOpenTime: {type: string, format: date-time}
        restorePath: {type: string}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetDriveNodeRequest:
      type: object
      required: [auth, nodeID]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        nodeID: {type: string, minLength: 1, x-go-name: NodeID, description: Drive node identifier from a listing; shared nodes require their returned sharing descriptor.}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}
        nodeID: 'FOLDER::synthetic::root'
    GetDriveNodeResult:
      type: object
      required: [node, metadata]
      description: Fresh node metadata and optional children. A missing child list remains distinguishable from an empty list.
      properties:
        node: {$ref: '#/components/schemas/DriveNode'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {node: {drivewsid: 'FOLDER::synthetic::root', items: []}, metadata: {statusCode: 200, headers: []}}
    ListDriveLibrariesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}
    ListDriveLibrariesResult:
      type: object
      required: [libraries, additionalMetadata, metadata]
      properties:
        libraries: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {libraries: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}

    DriveNodeSelector:
      type: object
      required: [nodeID, etag]
      description: Provider identifier and version token for a selected node; obtain the etag from a fresh node read to protect against stale writes.
      properties:
        nodeID: {type: string, minLength: 1, x-go-name: NodeID, description: Provider Drive node identifier.}
        etag: {type: string, x-go-name: ETag, description: Provider version token required by the mutation endpoint; an empty token remains an empty token.}
    DriveItemChangeResult:
      type: object
      required: [additionalMetadata, metadata]
      description: Provider acknowledgement and item metadata; this does not assert that background movement has completed.
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}, description: Optional provider item records; absence differs from an empty list.}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    CreateDriveFolderRequest:
      type: object
      required: [auth, parentID, name]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        parentID: {type: string, minLength: 1, x-go-name: ParentID, description: Destination folder identifier.}
        name: {type: string, description: Desired folder name.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, parentID: 'FOLDER::synthetic::root', name: Synthetic}
    CreateDriveFolderResult:
      type: object
      required: [additionalMetadata, metadata]
      properties:
        folders: {type: array, items: {$ref: '#/components/schemas/DriveNode'}, description: Optional created folder records; an empty list remains empty.}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {folders: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    MoveDriveNodesRequest:
      type: object
      required: [auth, destinationID, nodes]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        destinationID: {type: string, minLength: 1, x-go-name: DestinationID, description: Destination folder identifier.}
        nodes: {type: array, items: {$ref: '#/components/schemas/DriveNodeSelector'}, description: Nodes and version tokens; an empty move list is valid.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, destinationID: 'FOLDER::synthetic::destination', nodes: []}
    MoveDriveNodesResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    RenameDriveNodeRequest:
      type: object
      required: [auth, node, name]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
        name: {type: string, description: Desired node name.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}, name: Synthetic}
    RenameDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    TrashDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    TrashDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    RestoreDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    RestoreDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    DeleteDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    DeleteDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    PermanentlyDeleteDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    PermanentlyDeleteDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    DownloadDriveFileRequest:
      type: object
      required: [auth, documentID]
      description: Download a document using its node-provided document identifier and zone.
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        documentID: {type: string, minLength: 1, x-go-name: DocumentID, description: Document identifier from node metadata; this differs from the Drive node identifier.}
        zone: {type: string, minLength: 1, description: Node document zone; omission uses the reference private document zone.}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveDocumentServiceURL: 'https://documents.example.invalid', headers: []}
        documentID: synthetic-document
    DownloadDriveFileResult:
      type: object
      required: [content, tokenMetadata, metadata]
      description: Exact downloaded bytes and metadata from both HTTP exchanges; authentication updates remain caller-owned.
      properties:
        content: {type: string, format: byte, description: 'Exact file bytes, including empty content; a JSON media label does not change binary decoding.'}
        tokenMetadata: {$ref: '#/components/schemas/ResponseMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {content: '', tokenMetadata: {statusCode: 200, headers: []}, metadata: {statusCode: 200, headers: []}}

    UploadDriveFileRequest:
      type: object
      required: [auth, parentID, filename, content]
      description: Prepare, transfer and register a file; content starts at the current cursor while declared size is the complete seekable file length. The caller owns and closes the content reader.
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        parentID: {type: string, x-go-name: ParentID, description: Destination folder document identifier.}
        filename: {type: string, description: File name used for MIME inference and the multipart field.}
        content: {type: string, format: binary, x-go-type: io.ReadSeeker, description: Caller-owned seekable content; do not share its mutable cursor across concurrent uploads.}
        zone: {type: string, description: Document zone; omission uses the private document zone.}
        modificationTime: {type: string, format: date-time, description: File modification time; omission uses the client clock at registration.}
        creationTime: {type: string, format: date-time, description: File creation time; omission uses the client clock at registration.}
    UploadedDriveFile:
      type: object
      required: [fileChecksum, wrappingKey, referenceChecksum, size]
      properties:
        fileChecksum: {type: string}
        wrappingKey: {type: string}
        referenceChecksum: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        receipt: {type: string, description: Optional provider receipt; empty uploads may omit it.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    RegisteredDriveDocument:
      type: object
      properties:
        documentID: {type: string, x-go-name: DocumentID}
        status: {type: string, description: Open provider acknowledgement status.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    UploadDriveFileResult:
      type: object
      required: [documentID, uploadToken, uploadedFile, additionalReceiptMetadata, additionalRegistrationMetadata, preparationMetadata, transferMetadata, registrationMetadata]
      description: Provider upload and registration acknowledgements; no uncertain upload is retried automatically.
      properties:
        documentID: {type: string, x-go-name: DocumentID}
        uploadToken: {type: string, description: Secret token used in preparation and registration; returned for caller-owned session parameters.}
        uploadedFile: {$ref: '#/components/schemas/UploadedDriveFile'}
        documents: {type: array, items: {$ref: '#/components/schemas/RegisteredDriveDocument'}}
        status: {type: string, description: Optional open registration status.}
        additionalReceiptMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        additionalRegistrationMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        preparationMetadata: {$ref: '#/components/schemas/ResponseMetadata'}
        transferMetadata: {$ref: '#/components/schemas/ResponseMetadata'}
        registrationMetadata: {$ref: '#/components/schemas/ResponseMetadata'}

    FindMyDevice:
      type: object
      required: [id]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string}
        deviceModel: {type: string}
        deviceDisplayName: {type: string}
        deviceClass: {type: string}
        modelDisplayName: {type: string}
        rawDeviceModel: {type: string}
        deviceColor: {type: string, nullable: true}
        baUUID: {type: string}
        prsId: {type: string, nullable: true}
        deviceStatus: {type: string, description: Open provider status code.}
        batteryLevel: {type: number, format: double, description: Provider battery level; no bound is inferred from a single sample.}
        batteryStatus: {type: string}
        lostModeCapable: {type: boolean}
        features: {$ref: '#/components/schemas/FindMyFeatures'}
        location: {$ref: '#/components/schemas/FindMyLocation'}
        msg: {$ref: '#/components/schemas/FindMyCommandState'}
        mesg: {$ref: '#/components/schemas/FindMyCommandState'}
        snd: {$ref: '#/components/schemas/FindMyCommandState'}
        remoteLock: {$ref: '#/components/schemas/FindMyCommandState'}
        lostDevice: {$ref: '#/components/schemas/FindMyLostState'}
        lockedTimestamp: {$ref: '#/components/schemas/NullableJSONValue'}
        wipedTimestamp: {$ref: '#/components/schemas/NullableJSONValue'}
        remoteWipe: {$ref: '#/components/schemas/NullableJSONValue'}
        trackingInfo: {$ref: '#/components/schemas/NullableJSONValue'}
        lostTimestamp: {type: string}
        maxMsgChar: {type: integer}
        passcodeLength: {type: integer}
        activationLocked: {type: boolean}
        canWipeAfterLock: {type: boolean}
        darkWake: {type: boolean}
        fmlyShare: {type: boolean}
        isLocating: {type: boolean}
        isMac: {type: boolean}
        locFoundEnabled: {type: boolean}
        locationCapable: {type: boolean}
        locationEnabled: {type: boolean}
        lostModeEnabled: {type: boolean}
        lowPowerMode: {type: boolean}
        thisDevice: {type: boolean}
        wipeInProgress: {type: boolean}
        audioChannels: {type: array, items: {$ref: '#/components/schemas/UnknownJSONValue'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyFeatures:
      type: object
      description: Open device feature flags; absent flags do not establish capability.
      properties:
        MSG: {type: boolean, description: Messaging support.}
        SND: {type: boolean, description: Sound support.}
        LOC: {type: boolean, description: Location support.}
        WIP: {type: boolean, description: Remote erase support.}
        BTR: {type: boolean}
        LLC: {type: boolean}
        CLK: {type: boolean}
        TEU: {type: boolean}
        CLT: {type: boolean}
        SVP: {type: boolean}
        SPN: {type: boolean}
        XRM: {type: boolean}
        CWP: {type: boolean}
        LMG: {type: boolean}
        LKL: {type: boolean}
        LST: {type: boolean}
        LKM: {type: boolean}
        WMG: {type: boolean}
        PSS: {type: boolean}
        PIN: {type: boolean}
        LCK: {type: boolean}
        REM: {type: boolean}
        MCS: {type: boolean}
        KEY: {type: boolean}
        KPD: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyLocation:
      type: object
      nullable: true
      properties:
        latitude: {type: number, format: double, minimum: -90, maximum: 90, description: Latitude in degrees.}
        longitude: {type: number, format: double, minimum: -180, maximum: 180, description: Longitude in degrees.}
        altitude: {type: number, format: double}
        floorLevel: {type: integer}
        horizontalAccuracy: {type: number, format: double}
        verticalAccuracy: {type: number, format: double}
        timeStamp: {type: integer, format: int64, description: Provider location timestamp in milliseconds since the Unix epoch.}
        positionType: {type: string}
        locationType: {type: string}
        isOld: {type: boolean}
        isInaccurate: {type: boolean}
        locationFinished: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyCommandState:
      type: object
      nullable: true
      description: Provider command state; acknowledgement does not establish physical completion.
      properties:
        createTimestamp: {type: integer, format: int64}
        statusCode: {type: string}
        strobe: {type: boolean}
        userText: {type: boolean}
        playSound: {type: boolean}
        vibrate: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyLostState:
      type: object
      nullable: true
      properties:
        stopLostMode: {type: boolean}
        emailUpdates: {type: boolean}
        userText: {type: boolean}
        sound: {type: boolean}
        ownerNbr: {type: string}
        text: {type: string}
        createTimestamp: {type: integer, format: int64}
        statusCode: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyMember:
      type: object
      properties:
        deviceFetchStatus: {type: string, x-extensible-enum: [LOADING, READY, DONE], description: Open family device fetch status; LOADING members may require bounded polling.}
        firstName: {type: string}
        lastName: {type: string}
        appleId: {type: string}
        accountFormatter: {type: integer}
        useAuthWidget: {type: boolean}
        isHSA: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyUserInfo:
      type: object
      nullable: true
      properties:
        hasMembers: {type: boolean}
        firstName: {type: string}
        lastName: {type: string}
        accountFormatter: {type: integer}
        membersInfo: {type: object, additionalProperties: {$ref: '#/components/schemas/FindMyMember'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    FindMyServerContext:
      type: object
      nullable: true
      description: Provider-issued opaque refresh context; the reference clears theftLoss before reuse.
      properties:
        theftLoss: {$ref: '#/components/schemas/NullableJSONValue'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    OpenFindMySessionRequest:
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, headers: [], findMyServiceURL: 'https://findmy.example.invalid'}, includeFamily: false}
      type: object
      required: [auth, includeFamily]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        includeFamily: {type: boolean, description: Include family devices and bounded readiness polling.}
    RefreshFindMyRequest:
      example: {locate: true}
      type: object
      required: [locate]
      properties:
        locate: {type: boolean, description: Request fresh locations when a provider refresh context exists.}
    FindMySnapshot:
      example: {devices: [{id: synthetic-device, name: Synthetic Device}], userInfo: null, serverContext: null}
      type: object
      required: [devices, userInfo, serverContext]
      description: Copied account-bound cache; absent or empty partial refreshes retain existing devices.
      properties:
        devices: {type: array, items: {$ref: '#/components/schemas/FindMyDevice'}}
        userInfo: {$ref: '#/components/schemas/FindMyUserInfo'}
        serverContext:
          allOf: [{$ref: '#/components/schemas/FindMyServerContext'}]
          nullable: true
          x-go-type: json.RawMessage
          description: Copied opaque provider continuation state with theftLoss cleared; never share across accounts.
    FindMySoundRequest:
      example: {deviceID: synthetic-device}
      type: object
      required: [deviceID]
      properties:
        deviceID: {type: string, x-go-name: DeviceID, description: Identifier returned by this session's device discovery.}
        subject: {type: string, description: Alert subject; omission uses Find My iPhone Alert.}
    FindMyMessageRequest:
      example: {deviceID: synthetic-device, sound: false, vibrate: false, strobe: false}
      type: object
      required: [deviceID, sound, vibrate, strobe]
      properties:
        deviceID: {type: string, x-go-name: DeviceID}
        subject: {type: string, description: Omission uses Find My iPhone Alert.}
        text: {type: string, description: Omission uses This is a note.}
        sound: {type: boolean}
        vibrate: {type: boolean}
        strobe: {type: boolean}
    FindMyLostRequest:
      example: {deviceID: synthetic-device, phoneNumber: '+15555550100'}
      type: object
      required: [deviceID, phoneNumber]
      properties:
        deviceID: {type: string, x-go-name: DeviceID}
        phoneNumber: {type: string, description: Contact number supplied for the lost-device message.}
        text: {type: string, description: Omission uses the reference's lost-device message.}
        passcode: {type: string, x-go-type-skip-optional-pointer: true, description: New passcode if required by the selected device; omission sends an empty passcode.}
    FindMyEraseRequest:
      example: {deviceID: synthetic-device}
      type: object
      required: [deviceID]
      properties:
        deviceID: {type: string, x-go-name: DeviceID}
        text: {type: string, description: Omission uses the reference's lost-device message.}
        passcode: {type: string, x-go-type-skip-optional-pointer: true}
    FindMyCommandResult:
      example: {responses: [{statusCode: 204, headers: []}], acknowledgement: ''}
      type: object
      required: [responses, acknowledgement]
      description: Command acknowledgement evidence; does not establish physical completion.
      properties:
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
        acknowledgement: {type: string, format: byte, x-go-type: '[]byte', description: Uninterpreted successful command bytes.}
    FindMyWaitKind:
      type: string
      enum: [family-poll, monitor]
      x-enum-varnames: [FindMyFamilyPollWait, FindMyMonitorWait]
    FindMyWaitRequest:
      example: {kind: family-poll, delay: 500000000}
      type: object
      required: [kind, delay]
      properties:
        kind: {$ref: '#/components/schemas/FindMyWaitKind'}
        delay: {type: integer, format: int64, minimum: 0, x-go-type: time.Duration, description: Delay in nanoseconds; Go callers use time.Duration.}

    FindMyDeviceDescriptionRequest:
      type: object
      required: [deviceID]
      description: Select a cached device and optional extra provider status fields; performs no request.
      properties:
        deviceID: {type: string, x-go-name: DeviceID}
        additionalStatus: {type: array, x-go-type-skip-optional-pointer: true, items: {type: string}, description: Additional provider field names; unknown or absent fields project to null.}
      example: {deviceID: synthetic-device, additionalStatus: [future]}
    FindMyCapabilities:
      type: object
      required: [sound, messaging, erase, lostMode, location]
      description: Provider-advertised capabilities; location also requires a non-null location value.
      properties:
        sound: {type: boolean}
        messaging: {type: boolean}
        erase: {type: boolean}
        lostMode: {type: boolean}
        location: {type: boolean}
      example: {sound: true, messaging: true, erase: false, lostMode: true, location: false}
    FindMyDeviceStatus:
      type: object
      required: [batteryLevel, deviceDisplayName, deviceStatus, name]
      description: Reference status subset plus requested additional fields; absent fields are explicit null.
      properties:
        batteryLevel: {type: number, format: double, nullable: true}
        deviceDisplayName: {type: string, nullable: true}
        deviceStatus: {type: string, nullable: true, description: Open provider status code.}
        name: {type: string, nullable: true}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
      example: {batteryLevel: null, deviceDisplayName: null, deviceStatus: null, name: null, future: [null, true]}
    FindMyDeviceDescription:
      type: object
      required: [device, name, model, modelName, deviceType, location, capabilities, status]
      description: Copied cached device data and reference-compatible metadata, status and capabilities.
      properties:
        device: {$ref: '#/components/schemas/FindMyDevice'}
        name: {type: string, description: Device name; missing metadata defaults to an empty string.}
        model: {type: string, description: Provider deviceModel; missing metadata defaults to an empty string.}
        modelName: {type: string, description: Provider deviceDisplayName; missing metadata defaults to an empty string.}
        deviceType: {type: string, description: Provider deviceClass; missing metadata defaults to an empty string.}
        location: {$ref: '#/components/schemas/FindMyLocation'}
        capabilities: {$ref: '#/components/schemas/FindMyCapabilities'}
        status: {$ref: '#/components/schemas/FindMyDeviceStatus'}
      example:
        device: {id: synthetic-device}
        name: ''
        model: ''
        modelName: ''
        deviceType: ''
        location: null
        capabilities: {sound: false, messaging: false, erase: false, lostMode: false, location: false}
        status: {batteryLevel: null, deviceDisplayName: null, deviceStatus: null, name: null}
