openapi: 3.0.3
info:
  title: iCloud client models
  version: 0.1.0
  description: Caller-owned authentication context and public account, Drive, and Find My results, independent of provider response envelopes.
paths: {}
components:
  schemas:
    PhotoVisitEvent:
      type: object
      required: [photo, responses]
      description: Owned photo projection and ordered response metadata available before the callback.
      properties:
        photo: {$ref: '#/components/schemas/Photo'}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    GetPhotosCursorRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        library: {$ref: '#/components/schemas/PhotoLibrary'}
    GetPhotosCursorResult:
      type: object
      required: [syncToken, responses]
      properties:
        syncToken: {type: string}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    GetPhotoChangesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        library: {$ref: '#/components/schemas/PhotoLibrary'}
        since: {type: string, description: Omission reads available initial changes.}
    PhotoChange:
      type: object
      required: [kind, recordName, recordType, deleted, modified]
      properties:
        kind: {type: string, enum: [updated, deleted], x-enum-varnames: [PhotoUpdated, PhotoDeleted]}
        recordName: {type: string}
        recordType: {type: string, nullable: true}
        deleted: {type: boolean}
        modified: {type: string, format: date-time, nullable: true, description: Provider modification instant.}
    GetPhotoChangesResult:
      type: object
      required: [changes, syncToken, responses]
      properties:
        changes: {type: array, items: {$ref: '#/components/schemas/PhotoChange'}}
        syncToken: {type: string, nullable: true}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    PhotoLibrary:
      type: object
      required: [id, zoneName, shared, isSharedLibrary, zoneType, ownerRecordName, syncToken]
      description: Caller-owned library identity; SharedSync zones discovered privately retain the private database.
      properties:
        id: {type: string, x-go-name: ID}
        zoneName: {type: string}
        zoneType: {type: string, nullable: true}
        ownerRecordName: {type: string, nullable: true}
        syncToken: {type: string, nullable: true}
        shared: {type: boolean, description: Selects the shared CloudKit database.}
        isSharedLibrary: {type: boolean, description: Shared-library capabilities independent of database scope.}
        indexingState: {type: string, enum: [FINISHED], x-go-type-skip-optional-pointer: true, description: Discovery initialization receipt; omission checks readiness.}
    ListPhotoLibrariesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
    ListPhotoLibrariesResult:
      type: object
      required: [libraries, responses]
      properties:
        libraries: {type: array, items: {$ref: '#/components/schemas/PhotoLibrary'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    CreateReminderRequest:
      example: {"auth":{"accountID":"synthetic-account","clientID":"synthetic-client","headers":[]},"listID":"List/synthetic-list","title":"Synthetic title"}
      type: object
      required: [auth, listID, title]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        listID: {type: string, x-go-name: ListID}
        title: {type: string}
        description: {type: string, x-go-type-skip-optional-pointer: true}
        completed: {type: boolean, x-go-type-skip-optional-pointer: true}
        dueDate: {type: string, format: date-time, nullable: true}
        priority: {type: integer, format: int64, x-go-type-skip-optional-pointer: true}
        flagged: {type: boolean, x-go-type-skip-optional-pointer: true}
        allDay: {type: boolean, x-go-type-skip-optional-pointer: true}
        timeZone: {type: string, x-go-type-skip-optional-pointer: true}
        parentReminderID: {type: string, x-go-name: ParentReminderID, x-go-type-skip-optional-pointer: true}
    UpdateReminderRequest:
      example: {"auth":{"accountID":"synthetic-account","clientID":"synthetic-client","headers":[]},"reminder":{"id":"Reminder/synthetic-reminder","listID":"List/synthetic-list","title":"Untitled","description":"","completed":false,"completedDate":null,"dueDate":null,"startDate":null,"priority":0,"flagged":false,"allDay":false,"deleted":false,"timeZone":null,"alarmIDs":[],"hashtagIDs":[],"attachmentIDs":[],"recurrenceRuleIDs":[],"parentReminderID":null,"created":null,"modified":null,"recordChangeTag":null}}
      type: object
      required: [auth, reminder]
      description: Write the supplied reminder snapshot and return an independent updated snapshot.
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        reminder: {$ref: '#/components/schemas/Reminder'}
    ReminderMutationResult:
      example: {"reminder":{"id":"Reminder/synthetic-reminder","listID":"List/synthetic-list","title":"Untitled","description":"","completed":false,"completedDate":null,"dueDate":null,"startDate":null,"priority":0,"flagged":false,"allDay":false,"deleted":false,"timeZone":null,"alarmIDs":[],"hashtagIDs":[],"attachmentIDs":[],"recurrenceRuleIDs":[],"parentReminderID":null,"created":null,"modified":null,"recordChangeTag":null},"responses":[]}
      type: object
      required: [reminder, responses]
      description: Updated or freshly hydrated reminder with ordered response evidence.
      properties:
        reminder: {$ref: '#/components/schemas/Reminder'}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    DeleteReminderRequest:
      type: object
      description: Soft-delete a reminder by raw or complete record identifier using its current revision.
      required: [auth, reminderID, recordChangeTag]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, headers: []}, reminderID: Reminder/synthetic-item, recordChangeTag: synthetic-old-tag}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        reminderID: {type: string, description: Raw identifier or complete Reminder record name.}
        recordChangeTag: {type: string, nullable: true, description: 'Current provider revision, or null when absent.'}
    DeleteReminderResult:
      type: object
      description: Acknowledged soft deletion with the refreshed revision and all response evidence.
      required: [deleted, modified, recordChangeTag, responses]
      example: {deleted: true, modified: '2023-11-14T22:13:20Z', recordChangeTag: synthetic-new-tag, responses: []}
      properties:
        deleted: {type: boolean, description: True after the provider accepts every record operation.}
        modified: {type: string, format: date-time, description: Modification instant sent to the provider.}
        recordChangeTag: {type: string, nullable: true, description: 'Last nonempty matching acknowledgement revision, or the supplied revision.'}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ApplySessionResponsesRequest:
      type: object
      description: Apply observed response cookie/token updates to a copied native session without making a network request.
      required: [session, responses]
      example: {session: {auth: {accountID: synthetic-account, clientID: synthetic-client, headers: []}, accountCountryCode: null, trustToken: synthetic-trust, trustedSession: true, requiresTwoFactor: false, requiresTwoStep: false, accountData: {}, responses: []}, responses: []}
      properties:
        session: {$ref: '#/components/schemas/ResumeSessionResult'}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ApplySessionResponsesResult:
      type: object
      description: Copied native session retaining all observed responses and cookie/token/trust/country rotations, including a failed read.
      required: [session]
      example: {session: {auth: {accountID: synthetic-account, clientID: synthetic-client, headers: []}, accountCountryCode: null, trustToken: synthetic-trust, trustedSession: true, requiresTwoFactor: false, requiresTwoStep: false, accountData: {}, responses: []}}
      properties:
        session: {$ref: '#/components/schemas/ResumeSessionResult'}
    ListRecentlyAddedPhotosRequest:
      type: object
      description: Enumerate the primary library newest first using the recently-added trailing window index.
      required: [auth]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
    ListRecentlyAddedPhotosResult:
      type: object
      description: Complete deduplicated newest-first photos and every initialization, library discovery and page response.
      required: [photos, responses]
      example: {photos: [], responses: []}
      properties:
        photos: {type: array, items: {$ref: '#/components/schemas/Photo'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    DownloadPhotoRequest:
      type: object
      description: Download one available rendition through its provider-issued resource URL after album lookup.
      required: [auth, album, photoID]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}, album: Library, photoID: synthetic-asset, version: original}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
        album: {type: string, description: Album identifier or display/full name.}
        photoID: {type: string, x-go-name: PhotoID, description: Requested asset identifier.}
        version: {$ref: '#/components/schemas/PhotoVersion', description: Rendition to download; omission selects original.}
    PhotoVersion:
      type: string
      description: Known photo/video resource key; a rendition unavailable on the selected asset returns null.
      x-enum-varnames: [PhotoOriginal, PhotoAlternative, PhotoMedium, PhotoThumb, PhotoOriginalVideo, PhotoMediumVideo, PhotoThumbVideo, PhotoSidecar, PhotoThumbImage, PhotoMediumImage]
      enum: [original, alternative, medium, thumb, original_video, medium_video, thumb_video, sidecar, thumb_image, medium_image]
      example: original
    DownloadPhotoResult:
      type: object
      description: Exact resource bytes, including an empty file, or explicit null when the rendition URL is unavailable. Every response is retained.
      required: [content, responses]
      example: {content: null, responses: []}
      properties:
        content: {type: string, format: byte, nullable: true, description: Exact bytes; JSON uses base64. Null means unavailable and empty means an empty file.}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    GetPhotoRequest:
      type: object
      description: Find one primary album photo by asset identifier, with enumeration fallback when direct lookup misses.
      required: [auth, album, photoID]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}, album: Library, photoID: synthetic-asset}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
        album: {type: string, description: Album identifier or display/full name.}
        photoID: {type: string, x-go-name: PhotoID, description: Requested asset identifier.}
    GetPhotoResult:
      type: object
      description: Matching photo or explicit null after direct and enumeration lookup, with every response.
      required: [photo, responses]
      example: {photo: null, responses: []}
      properties:
        photo:
          nullable: true
          allOf: [{$ref: '#/components/schemas/Photo'}]
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    GetLegacyRemindersSnapshotRequest:
      type: object
      description: Read the account-discovered legacy Reminders startup snapshot.
      required: [auth]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, legacyRemindersServiceURL: 'https://reminders.example.invalid', headers: []}}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
    GetLegacyRemindersSnapshotResult:
      type: object
      description: Legacy lists and startup reminders in provider order; completed discovery and CloudKit related records are not implied.
      required: [lists, reminders, metadata]
      example: {lists: [], reminders: [], metadata: {statusCode: 200, headers: [], cookieScopeURL: 'https://reminders.example.invalid/rd/startup'}}
      properties:
        lists: {type: array, items: {$ref: '#/components/schemas/LegacyReminderRecord'}}
        reminders: {type: array, items: {$ref: '#/components/schemas/LegacyReminderRecord'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    LegacyReminderRecord:
      type: object
      additionalProperties: true
      x-go-type: json.RawMessage
      description: Extensible legacy record without unobserved field assumptions. Lists may include title, guid, order, color and completedCount.
      example: {title: Example list, guid: synthetic-list}
    ListPhotoAssetsRequest:
      type: object
      description: Enumerate all paired assets of a primary smart/custom album in reference order.
      required: [auth, album]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}, album: Library}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
        album: {type: string, description: Primary album ID or display/full name.}
    ListPhotoAssetsResult:
      type: object
      description: Complete deduplicated photos and every initialization, discovery, count and page response.
      required: [photos, responses]
      example: {photos: [], responses: []}
      properties:
        photos: {type: array, items: {$ref: '#/components/schemas/Photo'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    Photo:
      type: object
      description: Logical photo with downloadable resources and preserved normalized asset metadata.
      required: [id, masterID, filename, size, dimensions, itemType, isLivePhoto, created, added, versions, assetMetadata]
      example: {id: synthetic-asset, masterID: synthetic-master, filename: photo.jpg, size: null, dimensions: [null, null], itemType: image, isLivePhoto: false, created: '1970-01-01T00:00:00Z', added: '1970-01-01T00:00:00Z', versions: {}, assetMetadata: {}}
      properties:
        id: {type: string, x-go-name: ID, description: Asset identifier.}
        masterID: {type: string, x-go-name: MasterID, description: Original master identifier.}
        filename: {type: string, description: Decoded original filename or asset ID fallback.}
        size: {$ref: '#/components/schemas/UnknownJSONValue', description: Original resource size, normally integer bytes or null; future provider values retained.}
        dimensions: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/UnknownJSONValue'}, description: 'Width then height, normally integer pixels or null; provider values retained.'}
        itemType: {type: string, enum: [image, movie], description: Logical media kind.}
        isLivePhoto: {type: boolean, description: Image with an accompanying video file type.}
        created: {type: string, format: date-time, description: Capture time or Unix epoch when unset.}
        added: {type: string, format: date-time, description: Library insertion time or Unix epoch when unset.}
        versions: {type: object, additionalProperties: {$ref: '#/components/schemas/PhotoResource'}, description: Available original/alternative/preview/video/sidecar resources.}
        assetMetadata: {type: object, additionalProperties: true, x-go-type: json.RawMessage, description: Extensible provider asset metadata normalized as the reference model; no dependency type exposed.}
    PhotoResource:
      type: object
      description: One downloadable photo/video rendition with nullable provider details.
      required: [filename, url, size, type, checksum, width, height]
      example: {filename: photo.JPG, url: null, size: null, type: null, checksum: null, width: null, height: null}
      properties:
        filename: {type: string, description: Resource filename with reference file-type extension.}
        url: {$ref: '#/components/schemas/UnknownJSONValue', description: Download location, normally string or null; provider values retained.}
        size: {$ref: '#/components/schemas/UnknownJSONValue', description: Resource size, normally integer bytes or null.}
        type: {$ref: '#/components/schemas/UnknownJSONValue', description: Resource uniform type identifier or null.}
        checksum: {$ref: '#/components/schemas/UnknownJSONValue', description: Resource fingerprint or null.}
        width: {$ref: '#/components/schemas/UnknownJSONValue', description: Width, normally integer pixels or null.}
        height: {$ref: '#/components/schemas/UnknownJSONValue', description: Height, normally integer pixels or null.}
    GetPhotoAlbumCountRequest:
      type: object
      description: Read the primary photo album count using a smart/custom ID, name or full name.
      required: [auth, album]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}, album: Library}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
        album: {type: string, description: Album identifier or display/full name from ListPhotoAlbums.}
    GetPhotoAlbumCountResult:
      type: object
      description: Nonnegative indexed photo count and every response from initialization, discovery and counting.
      required: [count, responses]
      example: {count: 0, responses: []}
      properties:
        count: {type: integer, format: int64, minimum: 0, description: Number of indexed photos.}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ListPhotoAlbumsRequest:
      type: object
      description: Discover smart and custom albums in the primary photo library.
      required: [auth]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
    ListPhotoAlbumsResult:
      type: object
      description: Ordered smart and custom albums with response evidence from initialization and every page.
      required: [albums, responses]
      example: {albums: [], responses: []}
      properties:
        albums: {type: array, items: {$ref: '#/components/schemas/PhotoAlbum'}, description: "Duplicate IDs retain their last value and first position."}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    PhotoAlbum:
      type: object
      description: One smart album or custom photo album with its resolved folder path.
      required: [id, name, fullName, recordChangeTag]
      example: {id: Library, name: Library, fullName: Library, recordChangeTag: null}
      properties:
        id: {type: string, x-go-name: ID, description: Provider album record identifier or smart album name.}
        name: {type: string, description: Decoded display name.}
        fullName: {type: string, description: Name including discovered ancestor folders.}
        recordChangeTag: {type: string, nullable: true, description: Provider revision or null when omitted.}
    GetPhotosStatusRequest:
      type: object
      description: Check the primary photo library using caller-owned authentication.
      required: [auth]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, photosServiceURL: 'https://photos.example.invalid', headers: []}}
      properties:
        library: {$ref: '#/components/schemas/PhotoLibrary', description: Omission selects the primary library.}
        auth: {$ref: '#/components/schemas/AuthContext'}
    GetPhotosStatusResult:
      type: object
      description: Ready primary photo library indexing state and current change cursor.
      required: [state, syncToken, metadata]
      example: {state: FINISHED, syncToken: null, metadata: {statusCode: 200, headers: []}}
      properties:
        state: {type: string, enum: [FINISHED], description: Provider indexing state; successful initialization returns FINISHED.}
        syncToken: {type: string, nullable: true, description: "Current CloudKit change cursor, or null when omitted."}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    ListReminderTagsRequest:
      type: object
      description: Look up ordered hashtags from raw or complete related record identifiers.
      required: [auth, ids]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, remindersServiceURL: 'https://reminders.example.invalid', headers: []}, ids: []}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        ids: {type: array, x-go-name: IDs, items: {type: string}, description: "Ordered raw or complete related record identifiers, preserving duplicates. Empty input performs no requests."}
    ListReminderTagsResult:
      type: object
      description: Ordered hashtags and all response evidence, without deduplication.
      required: [items, responses]
      example: {items: [], responses: []}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReminderHashtag'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ListReminderAttachmentsRequest:
      type: object
      description: Look up ordered attachments from raw or complete related record identifiers.
      required: [auth, ids]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, remindersServiceURL: 'https://reminders.example.invalid', headers: []}, ids: []}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        ids: {type: array, x-go-name: IDs, items: {type: string}, description: "Ordered raw or complete related record identifiers, preserving duplicates. Empty input performs no requests."}
    ListReminderAttachmentsResult:
      type: object
      description: Ordered attachments and all response evidence, without deduplication.
      required: [items, responses]
      example: {items: [], responses: []}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReminderAttachment'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ListReminderRecurrenceRulesRequest:
      type: object
      description: Look up ordered recurrence rules from raw or complete related record identifiers.
      required: [auth, ids]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, remindersServiceURL: 'https://reminders.example.invalid', headers: []}, ids: []}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        ids: {type: array, x-go-name: IDs, items: {type: string}, description: "Ordered raw or complete related record identifiers, preserving duplicates. Empty input performs no requests."}
    ListReminderRecurrenceRulesResult:
      type: object
      description: Ordered recurrence rules and all response evidence, without deduplication.
      required: [items, responses]
      example: {items: [], responses: []}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReminderRecurrenceRule'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ListReminderAlarmsRequest:
      type: object
      description: Look up ordered alarms and optional triggers from raw or complete related record identifiers.
      required: [auth, ids]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, remindersServiceURL: 'https://reminders.example.invalid', headers: []}, ids: []}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        ids: {type: array, x-go-name: IDs, items: {type: string}, description: "Ordered raw or complete related record identifiers, preserving duplicates. Empty input performs no requests."}
    ListReminderAlarmsResult:
      type: object
      description: Ordered alarms and optional triggers and all response evidence, without deduplication.
      required: [items, responses]
      example: {items: [], responses: []}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReminderAlarmWithTrigger'}}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}}
    ReminderAlarmWithTrigger:
      type: object
      description: One alarm with its resolved location trigger, or null when absent or unsupported.
      required: [alarm, trigger]
      example: {alarm: {id: Alarm/synthetic, reminderID: Reminder/synthetic, alarmUID: synthetic, triggerID: '', recordChangeTag: null}, trigger: null}
      properties:
        alarm: {$ref: '#/components/schemas/ReminderAlarm'}
        trigger:
          nullable: true
          allOf: [{$ref: '#/components/schemas/ReminderLocationTrigger'}]
    ListReminderSnapshotRequest:
      type: object
      description: Discover lists and collect complete reminders, or select one literal list record name.
      required: [auth]
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, remindersServiceURL: 'https://reminders.example.invalid', headers: []}}
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        listID: {type: string, x-go-name: ListID, description: "Optional literal list record name; omission or empty text discovers all lists."}
    ListReminderSnapshotResult:
      type: object
      description: Complete reminders including completed items; duplicate IDs retain their last value and first position across lists.
      required: [reminders, responses]
      example: {reminders: [], responses: []}
      properties:
        reminders: {type: array, items: {$ref: '#/components/schemas/Reminder'}, description: "Ordered complete reminder projections, without related-record collections."}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseMetadata'}, description: "List, membership asset and query response evidence in request order."}
    ReminderAlarm:
      type: object
      description: Alarm linked to a reminder and an optional trigger identifier.
      required: [id, reminderID, alarmUID, triggerID, recordChangeTag]
      example: {id: Alarm/synthetic, reminderID: Reminder/synthetic, alarmUID: synthetic, triggerID: synthetic, recordChangeTag: null}
      properties:
        id: {type: string, x-go-name: ID, description: "Complete provider record name."}
        reminderID: {type: string, x-go-name: ReminderID, description: "Complete parent reminder record name."}
        alarmUID: {type: string, x-go-name: AlarmUID, description: "Alarm unique identifier; absent values produce empty text."}
        triggerID: {type: string, x-go-name: TriggerID, description: "Trigger identifier; absent values produce empty text."}
        recordChangeTag: {type: string, nullable: true, description: "Provider revision; omitted revisions become explicit null."}
    ReminderLocationTrigger:
      type: object
      description: Location alarm geometry and proximity direction.
      required: [id, alarmID, title, address, latitude, longitude, radius, proximity, locationUID, recordChangeTag]
      example: {id: AlarmTrigger/synthetic, alarmID: Alarm/synthetic, title: '', address: '', latitude: 0, longitude: 0, radius: 0, proximity: 1, locationUID: '', recordChangeTag: null}
      properties:
        id: {type: string, x-go-name: ID, description: "Complete provider record name."}
        alarmID: {type: string, x-go-name: AlarmID, description: "Complete parent alarm record name."}
        title: {type: string, description: "Location label; absent values produce empty text."}
        address: {type: string, description: "Location address; absent values produce empty text."}
        latitude: {type: number, format: double, description: "Latitude in degrees; absent values produce zero."}
        longitude: {type: number, format: double, description: "Longitude in degrees; absent values produce zero."}
        radius: {type: number, format: double, minimum: 0, description: "Geofence radius in meters; must be nonnegative."}
        proximity: {type: integer, enum: [1, 2], x-enum-varnames: [ReminderArriving, ReminderLeaving], description: "Arrival or departure direction; unknown values default to arrival."}
        locationUID: {type: string, x-go-name: LocationUID, description: "Location unique identifier; absent values produce empty text."}
        recordChangeTag: {type: string, nullable: true, description: "Provider revision; omitted revisions become explicit null."}
    ReminderURLAttachment:
