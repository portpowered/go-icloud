openapi: 3.0.3
info:
  title: iCloud client models
  version: 0.1.0
  description: Caller-owned authentication context and public account results and Drive read/mutation results, independent of provider response envelopes.
paths: {}
components:
  schemas:
    UnknownJSONValue:
      description: Uninterpreted provider metadata, preserved as its original JSON value; its shape is genuinely unknown.
      anyOf:
        - {type: object, nullable: true}
        - {type: array, items: {$ref: '#/components/schemas/UnknownJSONValue'}}
        - {type: string}
        - {type: number}
        - {type: boolean}
      x-go-type: json.RawMessage
    AccountDevice:
      type: object
      description: Known device metadata fields are optional; future provider fields are preserved.
      properties:
        name: {type: string}
        modelDisplayName: {type: string}
        model: {type: string}
        osVersion: {type: string}
        udid: {type: string}
        serialNumber: {type: string}
        imei: {type: string}
        latestBackup: {type: string, description: Provider backup timestamp text; no timestamp format is inferred.}
        modelLargePhotoURL1x: {type: string}
        modelLargePhotoURL2x: {type: string}
        modelSmallPhotoURL1x: {type: string}
        modelSmallPhotoURL2x: {type: string}
        paymentMethods: {type: array, items: {type: string}, description: Associated payment-method identifiers.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    AccountPaymentMethod:
      type: object
      properties:
        balanceStatus: {type: string}
        id: {type: string}
        isCarKey: {type: boolean}
        lastFourDigits: {type: string}
        suspensionReason: {type: string}
        type: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    Header:
      type: object
      required: [name, value]
      description: One HTTP response or caller-owned authentication header value; repeated headers remain separate entries.
      properties:
        name: {type: string, description: Header name.}
        value: {type: string, description: Header value; authentication values may contain secrets.}
    AuthContext:
      type: object
      required: [accountID, clientID, headers]
      description: Caller-owned account identity and web authentication headers. The reusable client never saves this state.
      properties:
        accountID: {type: string, minLength: 1, x-go-name: AccountID, description: Authenticated account identifier returned by login.}
        clientID: {type: string, minLength: 1, x-go-name: ClientID, description: Client identifier reused by this account session.}
        accountServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: AccountServiceURL, description: HTTPS account origin from authenticated discovery; required by account reads except regional plan summaries.}
        driveServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: DriveServiceURL, description: HTTPS Drive origin from authenticated discovery; required by Drive operations.}
        driveDocumentServiceURL: {type: string, format: uri, x-go-type-skip-optional-pointer: true, x-go-name: DriveDocumentServiceURL, description: HTTPS document-service origin from authenticated discovery; required by Drive transfers.}
        chinaMainland: {type: boolean, default: false, description: Authenticated account region; true selects the mainland China subscription gateway.}
        clientBuildNumber: {type: string, description: Optional build parameter from the authentication context; omission remains omission.}
        clientMasteringNumber: {type: string, description: Optional mastering parameter from the authentication context; omission remains omission.}
        headers: {type: array, items: {$ref: '#/components/schemas/Header'}, description: Account-specific cookie and web headers; an absent Accept value defaults to the reference wildcard.}
    ResponseMetadata:
      type: object
      required: [statusCode, headers]
      description: Response status and headers, including Set-Cookie values for caller-owned session updates.
      properties:
        statusCode: {type: integer, minimum: 100, maximum: 599, description: Provider HTTP response status.}
        headers: {type: array, items: {$ref: '#/components/schemas/Header'}, description: Header entries sorted by name; repeated values retain order within each name.}
    AccountMetadata:
      type: object
      description: Additional uninterpreted account-level provider fields; nulls and original JSON numbers remain intact.
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetAccountDevicesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountDevicesResult:
      type: object
      required: [devices, paymentMethods, additionalMetadata, metadata]
      description: Fresh account devices and payment-method details. Empty devices are successful; no shared cache is used.
      properties:
        devices: {type: array, items: {$ref: '#/components/schemas/AccountDevice'}}
        paymentMethods: {type: array, items: {$ref: '#/components/schemas/AccountPaymentMethod'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example:
        devices: [{name: synthetic-device, modelDisplayName: Synthetic Model}]
        paymentMethods: []
        additionalMetadata: {}
        metadata: {statusCode: 200, headers: []}
    ErrorKind:
      type: string
      description: Inspectable client failure class; errors preserve their cause separately from their safe display message.
      enum: [configuration, transport, canceled, timeout, unauthorized, forbidden, not-found, rate-limited, unavailable, provider, invalid-response]

    NullableJSONValue:
      description: An uninterpreted named provider value; distinguish omitted values from explicit JSON null.
      nullable: true
      x-go-type: json.RawMessage

    AccountFamilyMember:
      type: object
      properties:
        lastName: {type: string, nullable: true}
        dsid: {type: string, nullable: true}
        originalInvitationEmail: {type: string, nullable: true}
        fullName: {type: string, nullable: true}
        appleIdForPurchases: {type: string, nullable: true}
        appleId: {type: string, nullable: true}
        firstName: {type: string, nullable: true}
        ageClassification: {$ref: '#/components/schemas/NullableJSONValue'}
        familyId: {$ref: '#/components/schemas/NullableJSONValue'}
        hasParentalPrivileges: {$ref: '#/components/schemas/NullableJSONValue'}
        hasScreenTimeEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        hasAskToBuyEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        hasSharePurchasesEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        shareMyLocationEnabledFamilyMembers: {$ref: '#/components/schemas/NullableJSONValue'}
        hasShareMyLocationEnabled: {$ref: '#/components/schemas/NullableJSONValue'}
        dsidForPurchases: {$ref: '#/components/schemas/NullableJSONValue'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountStorageUsage:
      type: object
      required: [usedStorageInBytes, totalStorageInBytes]
      properties:
        usedStorageInBytes: {type: integer, format: int64, minimum: 0, description: Used storage in bytes.}
        totalStorageInBytes: {type: integer, format: int64, minimum: 0, description: Total storage in bytes; used storage may exceed quota.}
        compStorageInBytes: {type: integer, format: int64, minimum: 0, description: Provider comp storage in bytes.}
        commerceStorageInBytes: {type: integer, format: int64, minimum: 0, description: Provider commerce storage in bytes.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountQuota:
      type: object
      properties:
        overQuota: {type: boolean}
        haveMaxQuotaTier: {type: boolean}
        almost-full: {type: boolean}
        paidQuota: {type: boolean}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}

    AccountMediaUsage:
      type: object
      required: [mediaKey]
      properties:
        mediaKey: {type: string}
        displayLabel: {type: string}
        displayColor: {type: string, description: Provider display color text; no encoding is inferred.}
        usageInBytes: {type: integer, format: int64, minimum: 0, description: Storage used by this media category in bytes.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetAccountFamilyRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountFamilyResult:
      type: object
      required: [members, additionalMetadata, metadata]
      description: Fresh family records; an omitted family list is successful and empty.
      properties:
        members: {type: array, items: {$ref: '#/components/schemas/AccountFamilyMember'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {members: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    GetAccountMemberPhotoRequest:
      type: object
      required: [auth, memberID]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        memberID: {type: string, minLength: 1, x-go-name: MemberID, description: Member DSID returned by GetAccountFamily; no complete member object is needed.}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
        memberID: synthetic-member
    GetAccountMemberPhotoResult:
      type: object
      required: [content, metadata]
      description: Exact member-photo bytes, including an empty successful body, and their HTTP metadata.
      properties:
        content: {type: string, format: byte, description: Exact response bytes; do not infer an image format from the provider label.}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {content: '', metadata: {statusCode: 200, headers: []}}
    GetAccountStorageRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: []}
    GetAccountStorageResult:
      type: object
      required: [usage, media, additionalMetadata, metadata]
      description: Fresh storage usage and available quota/media metadata. Byte counts remain absolute, including zero totals and usage above quota.
      properties:
        usage: {$ref: '#/components/schemas/AccountStorageUsage'}
        quota: {$ref: '#/components/schemas/AccountQuota'}
        media: {type: array, items: {$ref: '#/components/schemas/AccountMediaUsage'}}
        additionalMetadata: {$ref: '#/components/schemas/AccountMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {usage: {usedStorageInBytes: 15, totalStorageInBytes: 100}, media: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    GetAccountPlanSummaryRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, accountServiceURL: 'https://account.example.invalid', headers: [], chinaMainland: false}
    GetAccountPlanSummaryResult:
      type: object
      required: [summary, metadata]
      description: Opaque subscription JSON; no unobserved plan fields are inferred.
      properties:
        summary: {$ref: '#/components/schemas/UnknownJSONValue'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {summary: {}, metadata: {statusCode: 200, headers: []}}

    DriveShareID:
      type: object
      description: Provider sharing descriptor; no fixed field is universally required by the reference.
      properties:
        owner: {type: string}
        zone: {type: string}
        share: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveNode:
      type: object
      description: Optional provider node metadata. Folder contents may be absent on a status-only response.
      properties:
        drivewsid: {type: string}
        docwsid: {type: string}
        name: {type: string}
        extension: {type: string}
        etag: {type: string}
        zone: {type: string}
        type:
          type: string
          description: Open provider node kind; known values include FILE and FOLDER.
          x-extensible-enum: [FILE, FOLDER]
        status:
          type: string
          description: Open provider status; known values include OK and NOT_FOUND.
          x-extensible-enum: [OK, NOT_FOUND]
        size:
          anyOf:
            - {type: integer, format: int64, minimum: 0}
            - {type: string, pattern: '^[0-9]+$'}
          description: File size in bytes; reference conversion accepts integer or decimal text. Omitted for folders.
          x-go-type: json.RawMessage
        dateChanged: {type: string, format: date-time}
        dateModified: {type: string, format: date-time}
        lastOpenTime: {type: string, format: date-time}
        restorePath: {type: string}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    GetDriveNodeRequest:
      type: object
      required: [auth, nodeID]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        nodeID: {type: string, minLength: 1, x-go-name: NodeID, description: Drive node identifier from a listing; shared nodes require their returned sharing descriptor.}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}
        nodeID: 'FOLDER::synthetic::root'
    GetDriveNodeResult:
      type: object
      required: [node, metadata]
      description: Fresh node metadata and optional children. A missing child list remains distinguishable from an empty list.
      properties:
        node: {$ref: '#/components/schemas/DriveNode'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {node: {drivewsid: 'FOLDER::synthetic::root', items: []}, metadata: {statusCode: 200, headers: []}}
    ListDriveLibrariesRequest:
      type: object
      required: [auth]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}
    ListDriveLibrariesResult:
      type: object
      required: [libraries, additionalMetadata, metadata]
      properties:
        libraries: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {libraries: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}

    DriveNodeSelector:
      type: object
      required: [nodeID, etag]
      description: Provider identifier and version token for a selected node; obtain the etag from a fresh node read to protect against stale writes.
      properties:
        nodeID: {type: string, minLength: 1, x-go-name: NodeID, description: Provider Drive node identifier.}
        etag: {type: string, x-go-name: ETag, description: Provider version token required by the mutation endpoint; an empty token remains an empty token.}
    DriveItemChangeResult:
      type: object
      required: [additionalMetadata, metadata]
      description: Provider acknowledgement and item metadata; this does not assert that background movement has completed.
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}, description: Optional provider item records; absence differs from an empty list.}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    CreateDriveFolderRequest:
      type: object
      required: [auth, parentID, name]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        parentID: {type: string, minLength: 1, x-go-name: ParentID, description: Destination folder identifier.}
        name: {type: string, description: Desired folder name.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, parentID: 'FOLDER::synthetic::root', name: Synthetic}
    CreateDriveFolderResult:
      type: object
      required: [additionalMetadata, metadata]
      properties:
        folders: {type: array, items: {$ref: '#/components/schemas/DriveNode'}, description: Optional created folder records; an empty list remains empty.}
        additionalMetadata: {type: object, additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {folders: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    MoveDriveNodesRequest:
      type: object
      required: [auth, destinationID, nodes]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        destinationID: {type: string, minLength: 1, x-go-name: DestinationID, description: Destination folder identifier.}
        nodes: {type: array, items: {$ref: '#/components/schemas/DriveNodeSelector'}, description: Nodes and version tokens; an empty move list is valid.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, destinationID: 'FOLDER::synthetic::destination', nodes: []}
    MoveDriveNodesResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    RenameDriveNodeRequest:
      type: object
      required: [auth, node, name]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
        name: {type: string, description: Desired node name.}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}, name: Synthetic}
    RenameDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    TrashDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    TrashDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    RestoreDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    RestoreDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    DeleteDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    DeleteDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    PermanentlyDeleteDriveNodeRequest:
      type: object
      required: [auth, node]
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        node: {$ref: '#/components/schemas/DriveNodeSelector'}
      example: {auth: {accountID: synthetic-account, clientID: synthetic-client, driveServiceURL: 'https://drive.example.invalid', headers: []}, node: {nodeID: 'FILE::synthetic::one', etag: synthetic-etag}}
    PermanentlyDeleteDriveNodeResult:
      allOf: [{$ref: '#/components/schemas/DriveItemChangeResult'}]
      example: {items: [], additionalMetadata: {}, metadata: {statusCode: 200, headers: []}}
    DownloadDriveFileRequest:
      type: object
      required: [auth, documentID]
      description: Download a document using its node-provided document identifier and zone.
      properties:
        auth: {$ref: '#/components/schemas/AuthContext'}
        documentID: {type: string, minLength: 1, x-go-name: DocumentID, description: Document identifier from node metadata; this differs from the Drive node identifier.}
        zone: {type: string, minLength: 1, description: Node document zone; omission uses the reference private document zone.}
      example:
        auth: {accountID: synthetic-account, clientID: synthetic-client, driveDocumentServiceURL: 'https://documents.example.invalid', headers: []}
        documentID: synthetic-document
    DownloadDriveFileResult:
      type: object
      required: [content, tokenMetadata, metadata]
      description: Exact downloaded bytes and metadata from both HTTP exchanges; authentication updates remain caller-owned.
      properties:
        content: {type: string, format: byte, description: 'Exact file bytes, including empty content; a JSON media label does not change binary decoding.'}
        tokenMetadata: {$ref: '#/components/schemas/ResponseMetadata'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
      example: {content: '', tokenMetadata: {statusCode: 200, headers: []}, metadata: {statusCode: 200, headers: []}}
