{
  "version": "v2",
  "plugins": [
    {
      "local": [
        "go",
        "run",
        "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"
      ],
      "out": "internal/reminderstext/pb",
      "opt": [
        "paths=source_relative",
        "Mreminders.proto=github.com/portpowered/go-icloud/internal/reminderstext/pb",
        "Mversioned_document.proto=github.com/portpowered/go-icloud/internal/reminderstext/pb"
      ]
    }
  ]
}
