openapi: 3.0.3
info:
  title: Apple password SRP parameters
  version: 1.0.0
  description: RFC 5054 SRP-6a with SHA-256, the 2048-bit group, and Apple's password stretching.
paths: {}
components:
  schemas:
    Protocol:
      type: string
      enum: [s2k, s2k_fo]
    GroupPrime:
      type: string
      enum: []
      x-enum-varnames: [RFC5054Prime]
    Generator:
      type: integer
      enum: [2]
      x-enum-varnames: [RFC5054Generator]
    EphemeralBytes:
      type: integer
      enum: [256]
      x-enum-varnames: [RFC5054EphemeralBytes]
    SecretHighBit:
      type: integer
      enum: [128]
      x-enum-varnames: [EphemeralHighBit]
    PasswordSeparator:
      type: string
      enum: [':']
      x-enum-varnames: [IdentitySeparator]
