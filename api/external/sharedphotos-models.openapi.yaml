{
  "openapi": "3.0.3",
  "info": {
    "title": "Shared Photos",
    "version": "1.0.0"
  },
  "paths": {},
  "components": {
    "schemas": {
      "SharedAlbumsRequest": {
        "type": "object",
        "required": [],
        "properties": {},
        "additionalProperties": false,
        "example": {}
      },
      "SharedAssetsRequest": {
        "type": "object",
        "required": [
          "albumguid",
          "albumctag",
          "limit",
          "offset"
        ],
        "properties": {
          "albumguid": {
            "type": "string",
            "description": "Provider string."
          },
          "albumctag": {
            "type": "string",
            "description": "Provider string."
          },
          "limit": {
            "type": "string",
            "description": "Provider string."
          },
          "offset": {
            "type": "string",
            "description": "Provider string."
          }
        },
        "example": {
          "albumguid": "synthetic-stream-0",
          "albumctag": "synthetic-stream-tag",
          "limit": "200",
          "offset": "0"
        }
      },
      "SharedCountRequest": {
        "type": "object",
        "required": [
          "albumguid"
        ],
        "properties": {
          "albumguid": {
            "type": "string",
            "description": "Provider string."
          }
        },
        "example": {
          "albumguid": "synthetic-stream-0"
        }
      },
      "SharedAlbumAttributes": {
        "type": "object",
        "required": [
          "name",
          "creationDate",
          "allowcontributions",
          "ispublic"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "Provider string."
          },
          "creationDate": {
            "type": "string",
            "description": "Unix milliseconds as a decimal string."
          },
          "allowcontributions": {
            "type": "boolean"
          },
          "ispublic": {
            "type": "boolean"
          }
        }
      },
      "SharedAlbum": {
        "type": "object",
        "required": [
          "albumguid",
          "albumlocation",
          "albumctag",
          "ownerdsid",
          "sharingtype",
          "iswebuploadsupported",
          "attributes"
        ],
        "properties": {
          "albumguid": {
            "type": "string",
            "description": "Provider string."
          },
          "albumlocation": {
            "type": "string",
            "description": "Provider-issued HTTPS base URL ending in a slash. Asset routes resolve relative to this full URL, preserving nested path components.",
            "format": "uri",
            "pattern": "^https://[^?#]*/$"
          },
          "albumctag": {
            "type": "string",
            "description": "Provider string."
          },
          "ownerdsid": {
            "type": "string",
            "description": "Provider string."
          },
          "sharingtype": {
            "type": "string",
            "description": "Provider string."
          },
          "iswebuploadsupported": {
            "type": "boolean"
          },
          "attributes": {
            "$ref": "#/components/schemas/SharedAlbumAttributes"
          },
          "publicurl": {
            "type": "string",
            "nullable": true
          }
        },
        "example": {
          "albumguid": "synthetic-stream-0",
          "albumlocation": "https://stream-content.example.invalid/synthetic/",
          "albumctag": "synthetic-stream-tag",
          "ownerdsid": "synthetic-owner",
          "sharingtype": "owned",
          "iswebuploadsupported": false,
          "attributes": {
            "name": "Synthetic stream 0",
            "creationDate": "1700000000000",
            "allowcontributions": false,
            "ispublic": false
          }
        }
      },
      "SharedAlbumsResponse": {
        "type": "object",
        "required": [
          "albums"
        ],
        "properties": {
          "albums": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SharedAlbum"
            }
          }
        },
        "example": {
          "albums": [
            {
              "albumguid": "synthetic-stream-0",
              "albumlocation": "https://stream-content.example.invalid/synthetic/",
              "albumctag": "synthetic-stream-tag",
              "ownerdsid": "synthetic-owner",
              "sharingtype": "owned",
              "iswebuploadsupported": false,
              "attributes": {
                "name": "Synthetic stream 0",
                "creationDate": "1700000000000",
                "allowcontributions": false,
                "ispublic": false
              }
            }
          ]
        }
      },
      "SharedCountResponse": {
        "type": "object",
        "required": [
          "albumassetcount"
        ],
        "properties": {
          "albumassetcount": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        },
        "example": {
          "albumassetcount": 1
        }
      },
      "SharedPluginField": {
        "type": "string",
        "enum": [
          "likeCount",
          "likedByCaller"
        ]
      },
      "SharedStreamContentType": {
        "type": "string",
        "enum": [
          "plain/text"
        ]
      },
      "SharedMasterField": {
        "type": "string",
        "enum": [
          "originalCreationDate",
          "resOriginalFileSize"
        ]
      },
      "SharedIntegerValue": {
        "type": "object",
        "required": [
          "value"
        ],
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "SharedBooleanValue": {
        "type": "object",
