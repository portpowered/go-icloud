          "value"
        ],
        "properties": {
          "value": {
            "type": "boolean"
          }
        }
      },
      "SharedPluginFields": {
        "type": "object",
        "properties": {
          "likeCount": {
            "$ref": "#/components/schemas/SharedIntegerValue"
          },
          "likedByCaller": {
            "$ref": "#/components/schemas/SharedBooleanValue"
          }
        }
      },
      "SharedPhotoRecord": {
        "anyOf": [
          {
            "$ref": "#/components/schemas/SharedMasterRecord"
          },
          {
            "$ref": "#/components/schemas/SharedAssetRecord"
          },
          {
            "$ref": "#/components/schemas/SharedOtherRecord"
          }
        ]
      },
      "SharedRecordsResponse": {
        "type": "object",
        "properties": {
          "records": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SharedPhotoRecord"
            }
          }
        },
        "additionalProperties": {
          "$ref": "./cloudkit-models.openapi.yaml#/components/schemas/JsonValue"
        }
      },
      "SharedStringValue": {
        "type": "object",
