openapi: 3.0.3
info:
  title: iCloud Drive wire models
  version: 0.1.0
  description: Canonical request and response models for Drive navigation, mutations and document transfers.
paths: {}
components:
  schemas:
    UnknownJSONValue:
      description: Extensible provider metadata retained without floating-point conversion.
      anyOf:
        - {type: object, nullable: true}
        - {type: array, items: {$ref: '#/components/schemas/UnknownJSONValue'}}
        - {type: string}
        - {type: number}
        - {type: boolean}
      x-go-type: json.RawMessage
    NullableJSONValue:
      description: Named unknown value preserving omission and explicit null separately.
      nullable: true
      x-go-type: json.RawMessage
    DriveShareID:
      type: object
      description: Provider sharing descriptor; no fixed field is universally required by the reference.
      properties:
        owner: {type: string}
        zone: {type: string}
        share: {type: string}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveNode:
      type: object
      description: Optional provider node metadata. Folder contents may be absent on a status-only response.
      properties:
        drivewsid: {type: string}
        docwsid: {type: string}
        name: {type: string}
        extension: {type: string}
        etag: {type: string}
        zone: {type: string}
        type:
          type: string
          description: Open provider node kind; known values include FILE and FOLDER.
          x-extensible-enum: [FILE, FOLDER]
        status:
          type: string
          description: Open provider status; known values include OK and NOT_FOUND.
          x-extensible-enum: [OK, NOT_FOUND]
        size:
          anyOf:
            - {type: integer, format: int64, minimum: 0}
            - {type: string, pattern: '^[0-9]+$'}
          description: File size in bytes; reference conversion accepts integer or decimal text. Omitted for folders.
          x-go-type: json.RawMessage
        dateChanged: {type: string, format: date-time}
        dateModified: {type: string, format: date-time}
        lastOpenTime: {type: string, format: date-time}
        restorePath: {type: string}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveNodeQuery:
      type: object
      required: [drivewsid, partialData]
      properties:
        drivewsid: {type: string, minLength: 1}
        partialData: {type: boolean, enum: [false]}
        shareID: {$ref: '#/components/schemas/DriveShareID'}
      additionalProperties: false
    DriveNodeQueries:
      type: array
      minItems: 1
      items: {$ref: '#/components/schemas/DriveNodeQuery'}
      example: [{drivewsid: 'FOLDER::synthetic::root', partialData: false}]
    DriveNodes:
      type: array
      description: Requested node records; missing folder children remain an operation-level error.
      items: {$ref: '#/components/schemas/DriveNode'}
    DriveAppLibraries:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveFolderCreation:
      type: object
      required: [clientId, name]
      properties:
        clientId:
          type: string
          pattern: '^FOLDER::UNKNOWN_ZONE::TempId-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Temporary identifier with a lowercase UUIDv4 and RFC 4122 variant generated by the client.
        name: {type: string}
      additionalProperties: false
    DriveCreateFolders:
      type: object
      required: [destinationDrivewsId, folders]
      properties:
        destinationDrivewsId: {type: string, minLength: 1}
        folders: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DriveFolderCreation'}}
      additionalProperties: false
    DriveCreatedFolders:
      type: object
      properties:
        folders: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveItemChange:
      type: object
      required: [drivewsid, etag]
      properties:
        drivewsid: {type: string, minLength: 1}
        etag: {type: string}
        clientId: {type: string, description: Present for deletion and movement; omitted for permanent trash deletion and recovery.}
      additionalProperties: false
    DriveItemChanges:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveItemChange'}}
      additionalProperties: false
    DriveRenameItem:
      type: object
      required: [drivewsid, etag, name]
      properties:
        drivewsid: {type: string, minLength: 1}
        etag: {type: string}
        name: {type: string}
      additionalProperties: false
    DriveMoveItem:
      type: object
      required: [drivewsid, etag, clientId]
      properties:
        drivewsid: {type: string, minLength: 1}
        etag: {type: string}
        clientId: {type: string, description: The node identifier used by the reference for movement.}
      additionalProperties: false
    DriveRecoveryItem:
      type: object
      required: [drivewsid, etag]
      properties:
        drivewsid: {type: string, minLength: 1}
        etag: {type: string}
      additionalProperties: false
    DriveRenameItems:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveRenameItem'}}
      additionalProperties: false
    DriveTrashItems:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveMoveItem'}}
      additionalProperties: false
    DriveRecoverItems:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveRecoveryItem'}}
      additionalProperties: false
    DriveMoveItems:
      type: object
      required: [destinationDrivewsId, items]
      properties:
        destinationDrivewsId: {type: string, minLength: 1}
        items: {type: array, items: {$ref: '#/components/schemas/DriveMoveItem'}}
      additionalProperties: false
    DriveChangedItems:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DriveNode'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveContentToken:
      type: object
      properties:
        url: {type: string, format: uri}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveDownloadTokens:
      type: object
      description: Prefer data_token.url, then package_token.url; missing URLs are an operation-level error.
      properties:
        data_token: {$ref: '#/components/schemas/DriveContentToken'}
        package_token: {$ref: '#/components/schemas/DriveContentToken'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
      example: {data_token: {url: 'https://content.example.invalid/synthetic-file'}}
    DriveUploadRequest:
      type: object
      required: [filename, type, content_type, size]
      properties:
        filename: {type: string}
        type: {type: string, enum: [FILE]}
        content_type: {type: string, description: MIME type inferred from filename; empty when unknown.}
        size: {type: integer, format: int64, minimum: 0, description: 'Complete file size in bytes, independent of the current cursor.'}
      additionalProperties: false
      example: {filename: synthetic.txt, type: FILE, content_type: text/plain, size: 0}
    DriveUploadDestination:
      type: object
      required: [document_id, url]
      properties:
        document_id: {type: string}
        url: {type: string, format: uri}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveUploadDestinations:
      type: array
      minItems: 1
      items: {$ref: '#/components/schemas/DriveUploadDestination'}
    DriveUploadedFile:
      type: object
      required: [fileChecksum, wrappingKey, referenceChecksum, size]
      properties:
        fileChecksum: {type: string}
        wrappingKey: {type: string}
        referenceChecksum: {type: string}
        size: {type: integer, format: int64, minimum: 0, description: Transferred byte count.}
        receipt: {type: string, description: 'Optional, including for an empty file.'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveUploadReceipt:
      type: object
      required: [singleFile]
      properties:
        singleFile: {$ref: '#/components/schemas/DriveUploadedFile'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
      example: {singleFile: {fileChecksum: synthetic, wrappingKey: synthetic, referenceChecksum: synthetic, size: 0}}
    DriveDocumentData:
      type: object
      required: [signature, wrapping_key, reference_signature, size]
      properties:
        signature: {type: string}
        wrapping_key: {type: string}
        reference_signature: {type: string}
        size: {type: integer, format: int64, minimum: 0, description: Transferred size in bytes.}
        receipt: {type: string}
      additionalProperties: false
    DriveDocumentPath:
      type: object
      required: [starting_document_id, path]
      properties:
        starting_document_id: {type: string}
        path: {type: string, description: Filename basename within the selected folder.}
      additionalProperties: false
    DriveFileFlags:
      type: object
      required: [is_writable, is_executable, is_hidden]
      properties:
        is_writable: {type: boolean, enum: [true]}
        is_executable: {type: boolean, enum: [false]}
        is_hidden: {type: boolean, enum: [false]}
      additionalProperties: false
    DriveUpdateDocument:
      type: object
      required: [data, command, create_short_guid, document_id, path, allow_conflict, file_flags, mtime, btime]
      properties:
        data: {$ref: '#/components/schemas/DriveDocumentData'}
        command: {type: string, enum: [add_file]}
        create_short_guid: {type: boolean, enum: [true]}
        document_id: {type: string}
        path: {$ref: '#/components/schemas/DriveDocumentPath'}
        allow_conflict: {type: boolean, enum: [true]}
        file_flags: {$ref: '#/components/schemas/DriveFileFlags'}
        mtime: {type: integer, format: int64, description: Modification time in milliseconds since the Unix epoch.}
        btime: {type: integer, format: int64, description: Creation time in milliseconds since the Unix epoch.}
      additionalProperties: false
    DriveDocumentResult:
      type: object
      properties:
        document_id: {type: string}
        status: {type: string, description: Open provider status; OK is known.}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveUpdatedDocuments:
      type: object
      properties:
        status: {type: string, description: Open provider status; OK is known.}
        documents: {type: array, items: {$ref: '#/components/schemas/DriveDocumentResult'}}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
    DriveError:
      type: object
      description: Extensible JSON error envelope; raw response bytes must also remain available.
      properties:
        reason: {type: string, nullable: true}
        errorCode: {$ref: '#/components/schemas/NullableJSONValue'}
        error: {$ref: '#/components/schemas/NullableJSONValue'}
      additionalProperties: {$ref: '#/components/schemas/UnknownJSONValue'}
