package: photosync
generate:
  models: true
output: pkg/photosync/models.gen.go
output-options:
  skip-prune: true
  nullable-type: true
  # GO-13: doc.go owns package documentation; the models-only header owns its generated marker.
  user-templates:
    imports.tmpl: |
      {{- if opts.Generate.StdHTTPServer}}//go:build go1.22

      {{- end}}
      // Code generated by {{.ModuleName}} version {{.Version}} DO NOT EDIT.

      package {{.PackageName}}

      import (
          "bytes"
          "compress/flate"
          "context"
          "encoding/base64"
          "encoding/json"
          "encoding/xml"
          "errors"
          "fmt"
          "go.yaml.in/yaml/v3"
          "io"
          "os"
          "mime"
          "mime/multipart"
          "net/http"
          "net/url"
          "path"
          "strings"
          "time"

          "github.com/oapi-codegen/runtime"
          "github.com/oapi-codegen/nullable"
          openapi_types "github.com/oapi-codegen/runtime/types"
          "github.com/getkin/kin-openapi/openapi3"
          {{- range .RouterImports}}
          {{if .Alias}}{{.Alias}} {{end}}"{{.Package}}"
          {{- end}}
          {{- range .ExternalImports}}
          {{ . }}
          {{- end}}
          {{- range .AdditionalImports}}
          {{.Alias}} "{{.Package}}"
          {{- end}}
      )
import-mapping:
  ./client-models.openapi.yaml: github.com/portpowered/go-icloud/pkg/icloud
  ./photo-materialize.openapi.yaml: github.com/portpowered/go-icloud/internal/photomaterialize
