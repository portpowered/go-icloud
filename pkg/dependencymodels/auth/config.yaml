    union.tmpl: api/templates/schema-unions.tmpl
    typedef.tmpl: api/templates/schema-types.tmpl
  skip-prune: true
  nullable-type: true
import-mapping:
  ./bridge-models.openapi.yaml: github.com/portpowered/go-icloud/pkg/dependencymodels/bridge
